name: Build Multi-Platform Apps (Android, iOS IPA, macOS & Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. BUILD ANDROID APK (Ubuntu)
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Sync Capacitor Android
        run: node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Generate Keystore if missing
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias rysav -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=CapacitorApp, OU=App, O=Starter, L=City, S=State, C=ID"
          fi

      - name: Build Android Signed Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CapacitorApp-Android-APK
          path: android/app/build/outputs/apk/release/*.apk

  # ==========================================
  # 2. BUILD IOS IPA PACKAGE (macOS)
  # ==========================================
  build-ios:
    name: Build iOS IPA Package
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Sync Capacitor iOS
        run: node node_modules/@capacitor/cli/bin/capacitor sync ios

      - name: Build iOS App via Xcode
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath ios/build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Package App into .IPA File
        run: |
          mkdir -p ios/Payload
          cp -r ios/build/Build/Products/Release-iphoneos/App.app ios/Payload/
          cd ios
          zip -r CapacitorApp.ipa Payload
          cd ..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CapacitorApp-iOS-IPA
          path: ios/CapacitorApp.ipa

  # ==========================================
  # 3. BUILD MACOS DESKTOP APP (macOS)
  # ==========================================
  build-macos:
    name: Build macOS Desktop App (.dmg / .app)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build macOS App (Tauri)
        run: npx tauri build

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CapacitorApp-macOS-Desktop
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app

  # ==========================================
  # 4. BUILD WINDOWS EXE INSTALLER (Windows)
  # ==========================================
  build-windows:
    name: Build Windows EXE (Tauri)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Windows App (Tauri)
        run: npx tauri build

      - name: Upload Windows EXE Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CapacitorApp-Windows-Installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
